services:
  bootstrap:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - composer_cache:/tmp
    environment:
      COMPOSER_ALLOW_SUPERUSER: '1'
    command: >
      sh -lc '
        if [ ! -f artisan ]; then
          echo "Initializing Laravel Livewire starter kit...";
          composer create-project laravel/livewire-starter-kit . --no-interaction;
        fi;
        if [ ! -f .env ]; then cp .env.example .env; fi;
        php artisan key:generate --force;
      '
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: it_activity
      DB_USERNAME: it_activity
      DB_PASSWORD: it_activity
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: >
      sh -lc '
        php artisan migrate --force;
        php artisan optimize:clear;
        php-fpm -F
      '

  web:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: >
      sh -lc '
        npm install;
        npm run dev -- --host 0.0.0.0
      '
    ports:
      - "5173:5173"
    depends_on:
      - bootstrap

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: it_activity
      POSTGRES_USER: it_activity
      POSTGRES_PASSWORD: it_activity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_activity -d it_activity"]
      interval: 5s
      timeout: 5s
      retries: 20

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: it_activity
      DB_USERNAME: it_activity
      DB_PASSWORD: it_activity
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: php artisan schedule:work

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: it_activity
      DB_USERNAME: it_activity
      DB_PASSWORD: it_activity
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

volumes:
  postgres_data:
  node_modules:
  composer_cache:
