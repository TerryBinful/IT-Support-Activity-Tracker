x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: it-activity-tracker-app:latest
  pull_policy: never

services:
  app:
    <<: *app-image
    container_name: it-activity-tracker-app
    ports:
      - "8080:80"
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_config:/var/www/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *app-image
    container_name: it-activity-tracker-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_config:/var/www/config
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *app-image
    container_name: it-activity-tracker-worker
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_config:/var/www/config
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: it-activity-tracker-postgres
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: ${DB_DATABASE:-it_activity}
      POSTGRES_USER: ${DB_USERNAME:-it_activity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-it_activity_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-it_activity} -d ${DB_DATABASE:-it_activity}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  laravel_storage:
  laravel_config:
